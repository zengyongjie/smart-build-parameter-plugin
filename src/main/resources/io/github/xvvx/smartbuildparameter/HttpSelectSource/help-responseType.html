<p>How to turn the response body into options:</p>
<ul>
  <li><strong>JSON array</strong> — a top-level JSON array of plain values, e.g. <code>["a","b"]</code>.</li>
  <li><strong>JSON path</strong> — a simplified dot path into a JSON object with one <code>[*]</code>
      array expansion, e.g. <code>data.list[*].name</code>.</li>
  <li><strong>Text lines</strong> — one option per non-empty line.</li>
</ul>
