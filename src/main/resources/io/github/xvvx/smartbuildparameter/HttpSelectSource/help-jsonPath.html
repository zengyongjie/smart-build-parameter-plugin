<p>Used only for the “JSON path” response type. A dot-separated key path with at most one
<code>[*]</code> array expansion, e.g. <code>data.list[*].name</code> extracts the <code>name</code>
field of every element of <code>data.list</code>. The path must resolve to plain values; blank
results are removed and duplicates collapsed.</p>
